# /etc/supervisor/conf.d/ta-worker.conf
# Phase 6 reference. Run: `sudo supervisorctl reread && sudo supervisorctl update`.

[program:ta-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ta/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=ta
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/ta/worker.log
stopwaitsecs=3600
