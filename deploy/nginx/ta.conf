# /etc/nginx/sites-available/ta.conf
# Phase 6 reference. Replace <DOMAIN> and <STAGING-AUTH> during provisioning.

server {
    listen 80;
    server_name <DOMAIN> www.<DOMAIN>;
    return 301 https://<DOMAIN>$request_uri;
}

server {
    listen 443 ssl http2;
    server_name <DOMAIN>;

    root /var/www/ta/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/<DOMAIN>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<DOMAIN>/privkey.pem;

    client_max_body_size 32M;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Explicitly exclude authenticated, checkout, callback and private file
    # responses from shared caches, per PRD.
    location ~ ^/(admin|study|checkout|payment)/ {
        add_header Cache-Control "private, no-store" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Protect staging with HTTP basic auth (remove on production launch).
    # location / {
    #     auth_basic           "Staging";
    #     auth_basic_user_file /etc/nginx/.htpasswd-ta;
    #     try_files $uri $uri/ /index.php?$query_string;
    # }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 90s;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    location ~ /\.(env|git|ht) { deny all; }
}
